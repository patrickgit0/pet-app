<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1B1F1D">
  <p style="font-size:22px;font-weight:800;color:#0F6E5C;margin:0 0 24px">Adotaí</p>
  <h1 style="font-size:20px;margin:0 0 8px">Seu código de confirmação</h1>
  <p style="font-size:15px;line-height:1.5;color:#5B635F;margin:0 0 24px">
    Digite este código na tela de cadastro para confirmar seu e-mail:
  </p>
  <p style="font-size:36px;font-weight:800;letter-spacing:10px;background:#E6F2EE;color:#0A4F42;text-align:center;padding:18px 0;border-radius:14px;margin:0 0 24px">{{ .Token }}</p>
  <p style="font-size:13px;line-height:1.5;color:#5B635F;margin:0">
    O código vale por 1 hora. Se você não criou uma conta no Adotaí, é só ignorar este e-mail.
  </p>
</div>
